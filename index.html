<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Mayank Singh Portfolio</title>
<meta name="description" content="UX research case studies from field work on public services in Salarpur block, Uttar Pradesh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout: a field notebook — one left-aligned reading column, project cards in a two-up grid, case pages with a section index in the margin. */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#1A2340; --muted:#566079; --rule:#D9DEE8;
  --accent:#B07A0C; --accent-soft:#F6EBD3; --link:#2B4BA8;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --deva:"Noto Sans Devanagari", var(--body);
  --step-0:1.0625rem; --step-1:1.25rem; --step-2:1.6rem; --step-3:2.2rem; --step-4:clamp(2.2rem, 5vw, 3.4rem);
  --col:42rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141D; --surface:#181C28; --ink:#E7E9F0; --muted:#9BA3B7; --rule:#2A3042;
  --accent:#E2AA45; --accent-soft:#2C2616; --link:#93AEFF; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11141D; --surface:#181C28; --ink:#E7E9F0; --muted:#9BA3B7; --rule:#2A3042;
  --accent:#E2AA45; --accent-soft:#2C2616; --link:#93AEFF; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:var(--step-0);line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
a{color:var(--link);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:72rem;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;padding-block:1.25rem;border-bottom:1px solid var(--rule)}
.top .name{font-family:var(--display);font-size:1.15rem;color:var(--ink);text-decoration:none}
.top nav{display:flex;gap:1.25rem;font-size:.95rem}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover,.top nav a[aria-current="page"]{color:var(--ink)}

/* hero */
.hero{padding-block:3.5rem 2.5rem;display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;align-items:start}
@media (min-width:62rem){.hero{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.hero-text{display:grid;gap:1.25rem;min-width:0}
.hero-photo{margin:0;display:grid;gap:.5rem}
.hero-photo img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.hero-photo figcaption{font-size:.85rem}
.fw{max-width:52rem;padding-bottom:3rem;display:grid;gap:1.5rem}
.fw-pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1rem}
.fw-pics figure{margin:0;display:grid;gap:.4rem;align-content:start}
.fw-pics img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.fw > p{max-width:var(--col);font-size:1.05rem}
.fw-cover{margin:0;display:grid;gap:.5rem}
.lightbox{padding:0;border:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh}
.lightbox::backdrop{background:rgba(10,12,20,.88)}
.lb-scroll{width:100%;height:100%;overflow:auto;display:grid;place-items:start center;padding:3.5rem 1rem 2rem;box-sizing:border-box}
.lb-scroll img{max-width:min(100%,1400px);height:auto;display:block;border-radius:4px;background:#fff}
.lb-close{position:fixed;top:.75rem;right:1rem;width:2.5rem;height:2.5rem;border-radius:50%;border:0;background:#fff;color:#111;font-size:1.6rem;line-height:1;cursor:pointer;z-index:1}
.press-note{color:var(--muted);font-size:.95rem;margin:-1.5rem 0 3rem}
.fw-cover img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr));gap:2rem;padding-bottom:3rem}
.more article{display:grid;gap:.75rem;align-content:start}
.more .pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:.5rem}
.more .pics img{width:100%;height:12rem;object-fit:cover;border-radius:6px;border:1px solid var(--rule);display:block}
.more h3{font-size:var(--step-1)}
.more p{color:var(--muted);font-size:1rem}
.rstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr));gap:.5rem}
.rstrip img{width:100%;height:13rem;object-fit:cover;border-radius:6px;border:1px solid var(--rule);display:block}
.press{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:1.5rem;padding-bottom:3rem}
.clip{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:1rem;align-items:start;text-decoration:none;color:inherit;padding:1rem;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.clip:hover{border-color:var(--accent)}
.clip img{width:100%;height:auto;border:1px solid var(--rule);display:block}
.clip h3{font-size:1.1rem;color:var(--ink)}
.clip p{color:var(--muted);font-size:.95rem}
.clip .src{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.clip > div{display:grid;gap:.4rem;min-width:0}
.hero h1{font-size:var(--step-4)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:var(--step-1);color:var(--muted);max-width:var(--col)}
.place{display:flex;flex-wrap:wrap;gap:.35rem 1rem;align-items:baseline;font-size:.95rem;color:var(--muted)}
.place .deva{font-family:var(--deva)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem 2rem;margin-top:.75rem;padding-top:1.25rem;border-top:1px solid var(--rule)}
.facts div{display:grid;gap:.15rem}
.facts dt{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:1rem}

/* work grid */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;padding-block:2rem 1.25rem}
.section-head h2{font-size:var(--step-2)}
.group-head{padding-block:.5rem 1.25rem;border-top:1px solid var(--rule);margin-top:.5rem}
.group-head h3{font-size:var(--step-1);margin:1.25rem 0 0}
.group-head p{margin:.35rem 0 0;color:var(--muted);max-width:var(--col)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr));gap:2.25rem 2rem;padding-bottom:3rem}
.card{display:grid;gap:.85rem;text-decoration:none;color:inherit}
.card .thumb{aspect-ratio:16/10;overflow:hidden;border-radius:6px;border:1px solid var(--rule);background:var(--surface);max-width:100%}
.card .thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .35s ease}
.card:hover .thumb img{transform:scale(1.025)}
.card h3{font-size:var(--step-1);color:var(--ink)}
.card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.card p{color:var(--muted);font-size:1rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;margin:0;padding:0}
.tags li{font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;padding:.2rem .5rem;border-radius:3px;background:var(--accent-soft);color:var(--ink)}
.card .when{font-family:var(--mono);font-size:.75rem;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;padding-block:2.5rem 4rem;border-top:1px solid var(--rule)}
@media (min-width:56rem){.about{grid-template-columns:14rem minmax(0,1fr)}}
.about .body{display:grid;gap:1rem;max-width:var(--col)}
.about h2{font-size:var(--step-2)}
.about h3{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.75rem}

/* case page */
.case-head{padding-block:2.5rem 2rem;display:grid;gap:1rem;max-width:52rem}
.back{font-size:.95rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.case-head h1{font-size:var(--step-4)}
.case-head .sub{font-size:var(--step-1);color:var(--muted);max-width:var(--col)}
.meta{display:flex;flex-wrap:wrap;gap:.75rem 2rem;align-items:center;font-size:.95rem;padding-top:1rem;border-top:1px solid var(--rule)}
.meta .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem .9rem;border-radius:4px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:.95rem}
.btn:hover{opacity:.9}
.case-body{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem;padding-bottom:4rem}
@media (min-width:62rem){.case-body{grid-template-columns:13rem minmax(0,1fr)}}
.toc{display:none}
@media (min-width:62rem){.toc{display:block;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 1.5rem);align-self:start;max-height:calc(100vh - 3rem);overflow:auto}}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.88rem}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--ink)}
.toc .eyebrow{display:block;margin-bottom:.75rem}
article{display:grid;gap:2.75rem;min-width:0}
article section{display:grid;gap:1rem;max-width:var(--col);scroll-margin-top:1.5rem}
article section.wide{max-width:none}
article section.wide > :not(figure){max-width:var(--col)}
article h2{font-size:var(--step-2)}
article h3{font-size:var(--step-1)}
article section.sub-sec{padding-left:1rem;border-left:2px solid var(--accent)}
article section.summary p{font-size:var(--step-1);line-height:1.55}
article ul{margin:0;padding-left:1.2rem;display:grid;gap:.6rem}
article li::marker{color:var(--accent)}
figure{margin:.5rem 0 0;display:grid;gap:.6rem;max-width:min(100%, 58rem)}
figure.narrow{max-width:min(100%, 30rem)}
figure a{display:block;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
figure img{display:block;width:100%;height:auto}
figcaption{font-size:.9rem;color:var(--muted);max-width:var(--col)}
details.glossary{border-top:1px solid var(--rule);padding-top:1.25rem;max-width:var(--col)}
details.glossary summary{cursor:pointer;font-family:var(--display);font-size:var(--step-2)}
details.glossary summary span{font-family:var(--body);font-size:1rem;color:var(--muted)}
details.glossary ul{list-style:none;padding:0;margin-top:1.25rem;display:grid;gap:.75rem;font-size:.98rem}
.pager{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:1rem;border-top:1px solid var(--rule);padding-top:1.5rem}
.pager a{display:grid;gap:.2rem;text-decoration:none;color:var(--ink);padding:1rem;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager a.next{text-align:right}
footer{border-top:1px solid var(--rule);padding-block:1.5rem 2.5rem;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between}
.term{font-style:italic}
a.term{text-decoration-style:dotted;text-decoration-thickness:1px}
.gl{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="name" href="#">Mayank Singh</a>
    <nav aria-label="Main">
      <a href="#" data-nav="home">Work</a>
      <a href="#about" data-nav="about">About</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <span>Mayank Singh · UX research in public services</span>
    <span>Live tools on <a href="https://ms221088.github.io/Salarpur_KPI_maps/" target="_blank" rel="noopener">GitHub Pages</a></span>
  </footer>
</div>

<script src="case-studies.js"></script>
<script>
(function(){
  var S = window.CASE_STUDIES || [];
  var app = document.getElementById('app');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

  function home(){
    var card = function(c){
      return '<a class="card" href="#'+c.slug+'">'+
        '<div class="thumb"><img src="'+c.cover+'" alt="" loading="lazy"></div>'+
        '<ul class="tags">'+c.methods.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>'+
        '<h3>'+c.title+'</h3><p>'+esc(c.card)+'</p>'+(c.when?'<span class="when">'+esc(c.when)+'</span>':'')+'</a>';
    };
    var bySlug = {}; S.forEach(function(c){ bySlug[c.slug] = c; });
    var pw = MORE.filter(function(m){ return m.slug==='work-pichhwai'; })[0];
    if(pw) bySlug['work-pichhwai'] = {slug:pw.slug, cover:pw.pics[0].src, title:pw.title, card:pw.card, methods:['Visual communication','Folk art','Official adoption']};
    var used = {};
    var cards = GROUPS.map(function(g){
      var items = g.s.filter(function(x){ return bySlug[x]; });
      items.forEach(function(x){ used[x] = 1; });
      return '<div class="group-head"><h3>'+esc(g.t)+'</h3>'+(g.note?'<p>'+esc(g.note)+'</p>':'')+'</div>'+
        '<div class="grid">'+items.map(function(x){ return card(bySlug[x]); }).join('')+'</div>';
    }).join('');
    var rest = S.filter(function(c){ return !used[c.slug]; });
    if(rest.length) cards += '<div class="grid">'+rest.map(card).join('')+'</div>';
    return ''+
    '<section class="hero"><div class="hero-text">'+
      '<p class="eyebrow">UX research · public services · rural India</p>'+
      '<h1>I study how public services <em>actually reach</em> people in villages, and build tools that help officials act on it.</h1>'+
      '<p class="lead">For the past four years I have worked as a Chief Minister’s Research Fellow in an aspirational block in Uttar Pradesh: interviewing families in their homes, turning messy government data into maps, and getting departments to act on what both reveal.</p>'+
      '<p class="place"><span>Salarpur block, Budaun, Uttar Pradesh</span><span class="deva" lang="hi">विकास खण्ड सालारपुर, बदायूँ</span></p>'+
      '<dl class="facts">'+
        '<div><dt>Field</dt><dd>77 Gram Panchayats, monitored since Aug 2023</dd></div>'+
        '<div><dt>Methods</dt><dd>Household interviews, observation, data analysis, mapping, visual communication</dd></div>'+
        '<div><dt>Before this</dt><dd>Nearly six years as a software engineer</dd></div>'+
      '</dl>'+
    '</div><figure class="hero-photo"><img src="img/field-hero.jpg" width="1400" height="1050" alt="Mayank sits on a plastic chair with a notebook, interviewing a woman seated on a charpai in her courtyard"><figcaption>Interviewing a mother in her courtyard during a monitoring visit in Salarpur</figcaption></figure>'+
    '</section>'+
    '<div class="section-head"><h2>Case studies</h2><span class="eyebrow">'+(S.length+(pw?1:0))+' projects</span></div>'+
    cards+
    more()+
    press()+
    about();
  }

  var GROUPS = [
    {t:'Health: research and design', s:['kpi','madhubani','anaemia']},
    {t:'Health: mapping the data', note:'Three diseases, one method, and a different question each time: where is it, what is linked to it, and what is causing it.', s:['tb','diarrhoea','malaria']},
    {t:'Animal health and welfare', s:['gaushala','work-pichhwai']},
    {t:'Livelihoods', s:['shg','candles']}
  ];
  var MORE = [
    {slug:'pichhwai', card:'A four-panel folk-art poster on deworming and vaccinating cattle, printed for the block veterinary hospital.'},
    {slug:'inclusion', card:'Reaching a transgender household in Binawar through a trusted ASHA worker, then surveying their needs and turning the gaps into a department-wise action report.'},
    {slug:'bhil', card:'Bhil dot-painting workshops for 23 girls, on themes linked to what they study and see around them.'},
    {slug:'book-cover', card:'A painted cover for a Hindi novel on the abandonment of newborn girls, published by Hans Prakashan.'},
    {slug:'ddugky', card:'Getting the first young people from Salarpur into government computer training.'},
    {slug:'videos', card:'Short Hindi health videos on TB, screening and early pregnancy registration, shared on official WhatsApp groups.'}
  ];
  MORE[0].title = "Livestock health poster in Pichhwai style";
  MORE[0].pics = [{"src": "img/more-pichhwai.jpg", "alt": "Pichhwai-style painting in four panels showing a weak cow with worms, treatment, a healthy cow and vaccination"}, {"src": "img/more-pichhwai-wall.jpg", "alt": "The printed poster on the wall of the block veterinary hospital"}];
  MORE[0].body = 'I painted a four-panel Pichhwai-style poster showing why cattle need deworming and vaccination against foot-and-mouth disease: a weak cow with worms, treatment by a para-vet, a healthy cow giving more milk, and vaccination. It was shared on block and district WhatsApp groups, and printed under the National Animal Disease Control Programme with the hospital\u2019s details for two walls of the Salarpur block veterinary hospital.';
  MORE[1].title = "Health access for transgender residents";
  MORE[1].pics = [{"src": "img/more-inclusion.jpg", "alt": "Mayank with the Guru and two others outside a house in Binawar", "cap": "With the Guru and her family in Binawar"}, {"src": "img/more-inclusion-chc.jpg", "alt": "Screening at the Community Health Centre, with health staff at a desk", "cap": "Screening at the Community Health Centre"}];
  MORE[1].body = 'Through an ASHA worker, whose husband came with me, I met the Guru of a transgender household in Binawar and her three disciples, and talked with them about free screening for diabetes and high blood pressure, and about TB. Two of the four were screened: one disciple at the Community Health Centre and the Guru at a village camp; another declined. I also suggested updating their Aadhaar ID, which unlocks welfare schemes, and the Guru completed hers. A small start, which showed me how much a trusted go-between matters.<br><br>In October 2025 I went back with a structured questionnaire, household and individual, for all four members. None had a ration card, an Ayushman health card or any insurance; two had no bank account and two had never heard of TB; the household had no home or land of its own, and tap water had not reached them although the pipeline was laid. Almost every scheme turned out to depend on one missing document, the transgender certificate. From this I wrote a Hindi action report for the Chief Development Officer, assigning each gap to a department and asking for one joint camp at their home, arranged by phone with the Guru, because the household travels for work. Housing and land are to be offered only after asking them where they want to live. Photos shared with consent.';
  MORE[2].title = "Bhil art workshops for girls";
  MORE[2].pics = [{"src": "img/more-bhil-1.jpg", "alt": "Bhil-style dot painting of a man beside a cow with a first-aid box, on the theme of cattle vaccination"}, {"src": "img/more-bhil-2.jpg", "alt": "Bhil-style dot painting of a village hut and a woman carrying a basket"}, {"src": "img/more-bhil-3.jpg", "alt": "Bhil-style dot painting of Krishna with a cow and a peacock"}];
  MORE[2].body = 'I ran workshops in Bhil painting, a dot-based tribal art from central India, for 7 girls at the Baratekadar village council office (May 2023) and 16 girls at the Kasturba Gandhi residential girls’ school in Mongar (February 2024). Dot painting is easy for children to pick up, and I gave them themes that connect art with what they study and see around them, such as cattle vaccination, village life, ponds as habitats and religion. Shown here: paintings from the workshops.';
  MORE[3].title = "Book cover: <i lang=\"hi-Latn\">Paai Hui Ladki</i>";
  MORE[3].pics = [{"src": "img/more-cover-art.jpg", "alt": "Painting of a newborn girl abandoned by a roadside bin; a man reaches for her while three women look on in shock"}, {"src": "img/more-cover-launch.jpg", "alt": "Guests on stage at the seminar in Pokhara holding up prints of the book cover"}];
  MORE[3].body = 'I painted the cover for <i lang="hi-Latn">Paai Hui Ladki</i> (“The Found Girl”), a Hindi novel by Dr. Monika Devi, a fellow CM Fellow in Kotwali block, Bijnor, about the abandonment of newborn girls. It connects to the sex-ratio indicator and the <i lang="hi-Latn">Beti Bachao Beti Padhao</i> (“Save the daughter, educate the daughter”) scheme. A man reaches for an abandoned baby by a roadside bin, three women look on in shock, and the traffic moves past. Hans Prakashan, New Delhi accepted the book, and the cover was launched at an international seminar in Pokhara, Nepal, on 12–13 June 2026. A Hindi newspaper report on the launch said the cover “tells a story in itself.”';
  MORE[4].title = "Getting rural youth into skills training";
  MORE[4].pics = [{"src": "img/more-ddugky.jpg", "alt": "A mobilisation camp for skills training, with young people seated in front of a banner"}];
  MORE[4].body = 'No one from Salarpur had enrolled in the government’s DDU-GKY computer training (data entry operator), and the few who signed up dropped out. I spread the word through job fairs, mobilisation camps in several village councils, block WhatsApp groups and community resource persons. Six young people, one of them a woman, enrolled. The training partners had tied up with employers, such as e-Ashram Infotech, for on-the-job training and placement.';
  MORE[5].title = "Short health awareness videos";
  MORE[5].pics = [{"src": "img/more-videos.jpg", "alt": "Mayank explaining the framed Madhubani embroidery to camera outside a school"}];
  MORE[5].body = 'I made short Hindi videos with online tools such as InVideo AI, posted them on YouTube and shared them on official WhatsApp groups: on spotting TB symptoms and getting treated early, on why people over 30 should get screened for diabetes and blood pressure, on registering a pregnancy in the first trimester, where I present the Madhubani embroidery at the science exhibition, and one promoting an SHG member\u2019s drone-spraying service to farmers. '+

        '<p>My work sits between people and systems. I make random-sample household visits, asking mothers about antenatal care, nutrition, water, sanitation and more; I analyse the block’s data; and I build maps, dashboards and awareness material that health workers, block officials and NGOs use to decide where to act.</p>'+
        '<h3>How I research</h3>'+

        '<p>Before the fellowship I spent nearly six years as a software engineer at Cognizant. I hold a B.Tech in Computer Science and Engineering from Integral University, Lucknow, and an M.Tech in Software Engineering from BITS Pilani, which I completed while working at Cognizant through its work-integrated programme. I also paint, and folk styles such as Madhubani, Warli and Pichhwai often find their way into my awareness work.</p>'+

  var TRE = new RegExp('(' + TERMS.map(function(t){return t[0].replace(/[-.*+?^${}()|[\]\\]/g,'\\$&');}).join('|') + ')(s?)(?![\\w-])', 'g');

  function annotate(root){
    var done = {};
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:function(n){
      var p = n.parentElement;
      if(!p || p.closest('script,style,details.glossary,.term,.deva,figcaption a')) return NodeFilter.FILTER_REJECT;
      TRE.lastIndex = 0;
      return TRE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }});
    var nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var p = n.parentElement;
      var short = !!p.closest('h1,h2,h3,.tags,.toc,.pager,.top,.when,.k');
      var inLink = !!p.closest('a');
      var text = n.nodeValue, frag = document.createDocumentFragment(), last = 0, m;

        var prevChar = text.charAt(m.index - 1);
        if(/[\w-]/.test(prevChar)){ frag.appendChild(document.createTextNode(word)); last = TRE.lastIndex; continue; }
        var first = !short && !done[t[0]];
        var el;
        if(first && t[2] && !inLink){ el = document.createElement('a'); el.href = t[2]; el.target = '_blank'; el.rel = 'noopener'; }

        if(first){

          var after = text.slice(TRE.lastIndex);

          var alreadyGlossed = /^\s*\(/.test(after) || (!after.trim() && nextEl && nextEl.textContent && /^\s*\(/.test(nextEl.textContent));

        last = TRE.lastIndex;
      }
      if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      n.parentNode.replaceChild(frag, n);
